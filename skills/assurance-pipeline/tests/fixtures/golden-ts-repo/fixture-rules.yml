# Minimal, deterministic, OFFLINE Semgrep rules for the golden fixture.
# Purpose: prove the S2 adapter end-to-end (semgrep -> SARIF -> normalize -> StaticFinding) and
# precision (fires on the planted syntactic vuln, NOT on its clean lookalike) without depending on
# the evolving Semgrep registry. Real-repo detection uses registry rulesets (p/typescript, etc.).
# Semantic classes (tenant-isolation, object-scope authz) are intentionally NOT covered here — those
# are the LLM lenses' job in Phase 1b.
rules:
  - id: fixture-sql-string-concat
    languages: [typescript, javascript]
    severity: ERROR
    message: SQL query built by concatenating a variable into the query string (possible SQL injection).
    metadata:
      cwe: ["CWE-89"]
    patterns:
      - pattern: $DB.query("..." + $VAR + "...", ...)
  - id: fixture-ssrf-fetch-nonconstant-url
    languages: [typescript, javascript]
    severity: WARNING
    message: fetch() called with a non-constant URL (possible SSRF).
    metadata:
      cwe: ["CWE-918"]
    patterns:
      - pattern: fetch($URL, ...)
      - pattern-not: fetch("...", ...)
