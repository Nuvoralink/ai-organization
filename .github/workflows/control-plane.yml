name: Control plane assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit and killer-mutation tests
        run: npm test
      - name: Canonical boundary and schema validation
        run: npm run control:validate
      - name: Project overlay validation
        run: |
          npm run overlay:validate:auxara
          npm run overlay:validate:coachai
      - name: Create isolated installation roots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'control-plane-install'
          $roots = @{
            HOME = (Join-Path $root 'home')
            'PROJECT:auxara-dialer' = (Join-Path $root 'auxara')
            'PROJECT:coachai' = (Join-Path $root 'coachai')
            'DEPENDENCY:council-studio' = (Join-Path $root 'council-studio')
          }
          $roots | ConvertTo-Json | Set-Content registries/project-roots.local.json
      - name: Clean-machine dry run, install, and parity
        run: |
          npm run control:install -- --dry-run
          npm run control:install
          npm run control:check
          npm run overlay:install:auxara
          npm run overlay:check:auxara
          npm run overlay:install:coachai
          npm run overlay:check:coachai
